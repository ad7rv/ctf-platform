    <h1>🔬 Zero-Point Font</h1>
    <p>Secrets can hide in plain sight with CSS. There's a sentence between these arrows →<span style="font-size:0">C</span><span style="font-size:0">T</span><span style="font-size:0">F</span><span style="font-size:0">{</span><span style="font-size:0">1</span><span style="font-size:0">n</span><span style="font-size:0">v</span><span style="font-size:0">1</span><span style="font-size:0">s</span><span style="font-size:0">1</span><span style="font-size:0">b</span><span style="font-size:0">l</span><span style="font-size:0">3</span><span style="font-size:0">_</span><span style="font-size:0">s</span><span style="font-size:0">p</span><span style="font-size:0">4</span><span style="font-size:0">n</span><span style="font-size:0">5</span><span style="font-size:0">}</span>← but you can't see it.</p>
    <ul><li>Ctrl+A on the page and look at the selection, or read the source.</li></ul>
